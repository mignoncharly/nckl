# NCKL API server block template. Replace server_name with the approved NCKL API domain before enabling.
server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/nckl-api.access.log;
    error_log  /var/log/nginx/nckl-api.error.log;

    client_max_body_size 10M;

    location /static/ {
        alias /home/mignon/nckl/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /home/mignon/nckl/backend/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
